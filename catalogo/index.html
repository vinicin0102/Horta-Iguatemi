<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital | Horta Iguatemi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header class="header">
        <!-- Background yellow area -->
    </header>

    <div class="header-card">
        <div class="logo-container">
            <i class="fa-solid fa-leaf"></i>
        </div>
        <div class="info-content">
            <h1>Horta Iguatemi</h1>
            <div class="tags">
                <span class="tag">Hortifruti</span>
                <span class="tag status"><i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 5px;"></i> Aberto</span>
            </div>
            <div class="delivery-info">
                <div class="delivery-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>Selecione um endereço para entrega</span>
                </div>
                <div class="delivery-item">
                    <i class="fa-solid fa-motorcycle"></i>
                    <span>Pedido mínimo: R$ 30,00</span>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <select class="category-selector" id="categorySelect">
            <option value="todos">Todas as categorias</option>
            <option value="legumes">Legumes</option>
            <option value="verduras">Verduras</option>
            <option value="frutas">Frutas</option>
        </select>

        <div id="catalogContent">
            <!-- Categories and products will be rendered here -->
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Busca</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-receipt"></i>
            <span>Pedidos</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
